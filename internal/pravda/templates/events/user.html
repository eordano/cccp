{{ define "event-user" }}<div class="user-message">{{ if .Text }}{{ markdown .Text }}{{ end }}{{ template "inline-images" .Images }}</div>{{ end }}

{{ define "inline-images" }}{{ range . }}{{ if .DataURL }}<img class="inline-image" src="{{ .DataURL }}" alt="pasted image" loading="lazy" style="display:block;max-width:100%;max-height:30em;margin:0.4rem 0;border-radius:4px">{{ else }}<div class="dim">[image{{ if .MediaType }} {{ .MediaType }}{{ end }}]</div>{{ end }}{{ end }}{{ end }}

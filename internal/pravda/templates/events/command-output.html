{{ define "event-command-output" }}{{ $body := stripAnsi .Text }}{{ $lines := lineCount $body }}{{ if and (le $lines 1) (lt (len $body) 161) }}<div class="content-title">{{ if $body }}{{ $body }}{{ else }}(empty){{ end }}</div>{{ else }}<details><summary class="content-preview">{{ $lines }} lines · {{ len $body }} chars</summary><pre class="content-details selectable" style="max-height:30em">{{ $body }}</pre></details>{{ end }}{{ end }}
